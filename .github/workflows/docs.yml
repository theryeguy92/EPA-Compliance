name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  DBT_PROFILES_DIR: profiles
  DUCKDB_PATH: data/warehouse/ci.duckdb
  DBT_SEND_ANONYMOUS_USAGE_STATS: "false"

jobs:
  build-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run dbt deps
      - run: uv run python ingest/ingest.py --source sample
      - run: uv run dbt build --target ci
      - name: Generate a single-file docs site
        run: |
          uv run dbt docs generate --target ci --static
          mkdir -p site
          cp target/static_index.html site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
